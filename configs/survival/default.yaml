# Downstream Survival Analysis defaults matching Section 4 & pysurvival==0.1.2 (notebooks 2.0-5.0)
test_size: 0.4
include_user_id: true
include_static: false
include_past_episodes: false
drop_first_onehot: true
ibs_mode: paper
deepsurv_hidden_units: 150
deepsurv_activation: tanh
deepsurv_dropout: 0.2
deepsurv_lr: 0.0001
deepsurv_weight_decay: 0.0001
deepsurv_epochs: 1000
deepsurv_batch_size: null
mtlr_hidden_units: 150
mtlr_bins: 150
mtlr_binning: uniform
mtlr_l2_smooth: 0.01
mtlr_activation: tanh
mtlr_dropout: 0.2
mtlr_lr: 0.0001
mtlr_weight_decay: 0.0001
mtlr_epochs: 1000
mtlr_batch_size: null
n_trees: 200
max_depth: 5
min_samples_leaf: 10
max_samples: 0.63
seed: 42
