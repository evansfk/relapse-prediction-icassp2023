[mypy]
python_version = 3.12
strict = True
disallow_any_unimported = True
warn_unreachable = True
show_error_codes = True
enable_error_code = explicit-override, ignore-without-code, redundant-expr, truthy-bool, truthy-iterable, unused-awaitable, possibly-undefined, redundant-self, mutable-override

[mypy-sksurv.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True
