# TS-TCC configuration for the 12-hour dataset (L = 720, C = 10 -> 2048-dim embedding)
# Matches the IEEE ICASSP 2023 12-hour TS-TCC pretraining configuration (Sections 3-4)
input_channels: 10
seq_len: 720
kernel_size: 16
stride: 3
final_out_channels: 64
dropout: 0.35
tc_hidden_dim: 256
tc_timesteps: 9
transformer_depth: 4
transformer_heads: 4
transformer_mlp_dim: 64
transformer_dropout: 0.1
temperature: 0.2
use_cosine_similarity: true
lambda1: 1.0
lambda2: 0.7
jitter_ratio: 0.1
jitter_scale_ratio: 2.0
max_seg: 12
lr: 0.003
betas: [0.9, 0.99]
weight_decay: 0.0003
batch_size: 128
epochs: 200
seed: 42
