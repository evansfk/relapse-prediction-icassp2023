# Mixing-Up Contrastive Learning configuration (128-dim embedding for 4h / 8h / 12h)
# Matches the IEEE ICASSP 2023 Mixing-Up pretraining configuration (Section 3)
input_channels: 10
seq_len: 480
hidden_channels: [128, 256, 128]
kernel_sizes: [7, 5, 3]
dilations: [2, 4, 8]
projection_dim: 128
alpha: 1.0
temperature: 0.5
lr: 0.001
weight_decay: 0.0
batch_size: 32
epochs: 50
seed: 42
